<!doctype html><html lang="en"><meta charset="utf-8"><title>Piano audio rendering check</title>
<h1>Piano audio rendering check</h1><output id="result">Rendering offline…</output>
<script type="module">
  import { schedulePiano, loadPiano } from '/src/pianoAudio.ts';
  try {
    const context = new OfflineAudioContext(1, 88200, 44100);
    const events = [{midi:69,start:0,duration:2,hand:'melody'}];
    const recordings = await loadPiano(context, events);
    schedulePiano(context, events, 0.1, 0, 0.3, recordings);
    const rendered = await context.startRendering();
    const samples = rendered.getChannelData(0);
    const rms = (a,b) => Math.sqrt(samples.slice(a,b).reduce((sum,x) => sum+x*x,0)/(b-a));
    const before = rms(0,2205), during = rms(8820,13230), after = rms(52920,61740);
    if (before > 1e-6 || during < 0.005 || after > 1e-6) throw Error(`Unexpected envelope: ${before}, ${during}, ${after}`);
    document.getElementById('result').textContent = `PASS — actual audio samples: silence before (${before.toFixed(6)}), audible during (${during.toFixed(6)}), silence after (${after.toFixed(6)}).`;
  } catch (error) { document.getElementById('result').textContent = 'FAIL — ' + error.message; }
</script></html>
